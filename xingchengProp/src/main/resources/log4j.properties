#将等级为 XXX 的日志信息输出到console、I和E 三个目的地 console、I和E 分别定义在下面
log4j.rootLogger=INFO, console, I,E

### 输出信息到控制抬 ###
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %-60c %x - method:%l%n%m%n

### 输出 INFO  级别以上的日志
log4j.appender.I = org.apache.log4j.DailyRollingFileAppender
log4j.appender.I.File = /Users/jiangyi/test/info/info.log
log4j.appender.I.DatePattern='.'yyyy-MM-dd
log4j.appender.I.Append = true
log4j.appender.I.Threshold = INFO 
log4j.appender.I.layout = org.apache.log4j.PatternLayout
log4j.appender.I.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss.SSS}  %-5p %-60c %x - method:%l%n%m%n

### 输出ERROR 级别以上的日志到=E://logs/error.log ###
log4j.appender.E = org.apache.log4j.DailyRollingFileAppender
log4j.appender.E.File =  /Users/jiangyi/test/error/error.log
log4j.appender.E.DatePattern='.'yyyy-MM-dd
log4j.appender.E.Append = true
log4j.appender.E.Threshold = ERROR 
log4j.appender.E.layout = org.apache.log4j.PatternLayout
log4j.appender.E.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss.SSS}   %-5p %-60c %x - method:%l%n%m%n
